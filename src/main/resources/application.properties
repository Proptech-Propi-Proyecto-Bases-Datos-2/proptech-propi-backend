spring.application.name=proptech-propi

##spring.datasource.url=jdbc:sqlserver://localhost:1433;databaseName=DB_IF0010_2026_Propi;encrypt=true;trustServerCertificate=true
##spring.datasource.driver-class-name=com.microsoft.sqlserver.jdbc.SQLServerDriver

# URL limpia (sin integratedSecurity) para permitir login con usuario/contraseña de SQL Server
spring.datasource.url=jdbc:sqlserver://localhost:1433;databaseName=DB_IF0010_2026_Propi;encrypt=true;trustServerCertificate=true

# Credenciales predeterminadas para las consultas generales de Spring Boot
spring.datasource.username=login_admin
spring.datasource.password=Admin8071Pass$word123
spring.datasource.driver-class-name=com.microsoft.sqlserver.jdbc.SQLServerDriver


# Dialecto de Hibernate para SQL Server
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.SQLServerDialect
# Respeta los nombres exactos definidos en @Table y @Column.
spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl

# Muestra en la consola de Spring Boot las sentencias SQL ejecutadas (opcional)
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true



server.servlet.context-path=/proptech-propi
server.port=8084